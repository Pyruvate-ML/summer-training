server:
  port: 8080

spring:
  application:
    name: counseling-backend
  datasource:
    url: ${XINQIAO_DB_URL:jdbc:mysql://localhost:3306/xinqiao_counseling?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${XINQIAO_DB_USERNAME:root}
    password: ${XINQIAO_DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8

logging:
  level:
    org.springframework.jdbc.core: warn
