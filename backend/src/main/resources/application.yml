server:
  port: 8080

spring:
  application:
    name: counseling-backend
  datasource:
    url: jdbc:h2:mem:xinqiao;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.jdbc.core: warn
