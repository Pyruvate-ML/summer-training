server:
  port: 11234

spring:
  datasource:
    url: jdbc:h2:file:./h2data/mindbridge_counseling;MODE=MySQL;AUTO_RECONNECT=TRUE;NON_KEYWORDS=USER,VALUE,SYSTEM_USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always